name: RuleBook
options:
  bundleIdPrefix: net.steinbok
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # The library lives at the repository root so it stays consumable over SPM;
  # the app takes it as a local package, so edits show up with no versioning.
  RuleBookKit:
    path: ..
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    from: 2.0.0

targets:
  RuleBook:
    type: application
    platform: iOS
    sources:
      - path: RuleBook
    dependencies:
      - package: RuleBookKit
        product: RuleBookKit
      - package: MSAL
        product: MSAL
    info:
      path: RuleBook/Info.plist
      properties:
        CFBundleDisplayName: Rulebook
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.steinbok.RuleBook
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
